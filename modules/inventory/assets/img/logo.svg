<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- ระบบบริหารจัดการวัสดุและครุภัณฑ์: กล่องวัสดุ + โน้ตบุ๊ค (ครุภัณฑ์) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d6fe0"/><stop offset="1" stop-color="#0b3f8f"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc24b"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- โน้ตบุ๊ค -->
  <rect x="22" y="26" width="64" height="42" rx="5" fill="#e8f1ff"/>
  <rect x="27" y="31" width="54" height="32" rx="2" fill="#5aa3ff"/>
  <path d="M33 55l9-9 7 6 10-12 12 15z" fill="#e8f1ff" opacity=".9"/>
  <path d="M14 70h80l-5 8H19z" fill="#ffffff"/>
  <!-- กล่องวัสดุ -->
  <path d="M66 70l22-10 22 10v26l-22 11-22-11z" fill="url(#box)"/>
  <path d="M66 70l22 10 22-10" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M88 80v27" stroke="#b45309" stroke-width="2.5"/>
  <path d="M76 65.5l22 10v8" fill="none" stroke="#fff7e6" stroke-width="4" stroke-linecap="round"/>
  <!-- เครื่องหมายถูก (สถานะ/ตรวจนับ) -->
  <circle cx="34" cy="98" r="14" fill="#10b981"/>
  <path d="M27 98l5 5 9-10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
